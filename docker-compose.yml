# Local development infrastructure for the elderly care coordination
# platform. Brings up PostgreSQL, Redis, and MinIO with deterministic
# ports. Secrets are placeholders — replace via .env in real use.
#
# Usage:
#   docker compose up -d
#   docker compose down
#
# See ARCHITECTURE.md §3 for the role of each service.

name: ecc

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecc}
      POSTGRES_USER: ${POSTGRES_USER:-ecc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-real-use}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ecc} -d ${POSTGRES_DB:-ecc}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecc-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: ecc-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-in-real-use}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot bucket provisioning. Runs only on first start, exits 0.
  minio-bootstrap:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: ecc-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-change-me-in-real-use} &&
      (mc mb --ignore-existing local/${S3_BUCKET:-ecc-documents}) &&
      (mc anonymous set none local/${S3_BUCKET:-ecc-documents}) &&
      echo 'minio: bucket ready'
      "
    restart: 'no'

volumes:
  postgres_data:
  redis_data:
  minio_data:
