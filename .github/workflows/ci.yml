name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — typecheck, tests (unit + PostgreSQL integration), build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecc
          POSTGRES_PASSWORD: ecc-ci-secret
          POSTGRES_DB: ecc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecc -d ecc_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ecc:ecc-ci-secret@localhost:5432/ecc_ci
      # 32+ char CI-only secret (fail-fast validation requires it;
      # NODE_ENV=test also allows ephemeral fallback, but being explicit
      # keeps cookie/secure semantics predictable).
      JWT_ACCESS_SECRET: ci-only-secret-value-min-32-chars-0000000000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Phase 22 (P20-M-01 / P20-M-02). The repository pins
          # pnpm@11.25.0 via `packageManager`, and pnpm 11.25.0 declares
          # `"engines": { "node": ">=22.13" }`. Node 20 therefore cannot run
          # the package manager this repository declares, and the mismatch
          # was invisible because pnpm only warns about an unsatisfied
          # `engines` field by default. Every job now uses Node 24, which is
          # the same major the production images ship (node:24-alpine), so
          # CI exercises the runtime that is actually deployed rather than a
          # different one. Verified compatible: prisma/@prisma/client 5.22
          # (>=16.13), next 14.2 (>=18.17), @nestjs/* 10.4 (unconstrained),
          # argon2 0.45 (>=16.17), @swc/core 1.16 (>=10), vitest 2.1
          # (^18 || >=20), expo 51 / react-native 0.74 (>=18).
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ecc/api exec prisma generate

      - name: Validate Prisma schema
        run: pnpm --filter @ecc/api exec prisma validate

      - name: Apply migrations to fresh CI database
        run: pnpm --filter @ecc/api exec prisma migrate deploy

      - name: API typecheck
        run: pnpm --filter @ecc/api typecheck

      - name: API build
        run: pnpm --filter @ecc/api build

      - name: API build determinism (Phase 18 M-01 — clean, warm and stale
          tsbuildinfo builds must each emit dist/main.js)
        run: pnpm --filter @ecc/api build:verify

      # --- Phase 23: compiled-artifact parity, authorization structure, and
      # configuration contract. All three are fast (seconds), read only the
      # freshly built dist, and would otherwise catch their defect hours later
      # in the container job or not at all.
      #
      # W1 exists because Phase 22 shipped a production image in which
      # register and login returned 400 for everyone, while every source-level
      # suite was green: vitest/SWC and tsc emit DIFFERENT design:paramtypes
      # for a DTO imported with `import type`. Only tsc output ships, so the
      # gate reads the compiled artifact.
      - name: Compiled artifact — Nest decorator-metadata parity (Phase 23 W1)
        run: pnpm --filter @ecc/api verify:metadata

      - name: Compiled artifact — every non-public route is guarded (Phase 23 W3)
        run: pnpm --filter @ecc/api verify:routes

      - name: Configuration contract — env, ports, versions, secrets (Phase 23 W5)
        run: node scripts/verify-config-contract.mjs

      - name: Supply chain — lockfile, native modules, engines (Phase 23 W6)
        run: node scripts/verify-dependency-audit.mjs

      # Advisory triage, not a raw count. `pnpm audit` reports 91 advisories;
      # most are in build-time tools. This asserts that no critical/high
      # advisory is reachable from a deployed code path, with the evidence
      # recorded, so a genuinely reachable one fails the build instead of
      # being lost in the noise.
      - name: Supply chain — no reachable critical/high advisory (Phase 23 W6)
        run: node scripts/triage-vulnerabilities.mjs

      # Phase 25 (F-4/F-5). The triage script is only as good as the rules it
      # applies, and two of those rules were not what they claimed: the
      # `rewrites` check read the config file as TEXT and so missed the
      # `rewrites()` function form Next.js actually uses, and the generic
      # fallback filed any uncovered dev-only advisory as BUILD-TIME. These
      # assert the detection is AST-based and that the classifier fails closed
      # on an advisory nobody has read. Both run off fixtures or the real
      # source, so neither needs the network.
      - name: Supply chain — the triage classifier fails closed (Phase 25 F-5)
        run: node scripts/verify-dependency-triage.mjs

      - name: Web config — Next features are detected from the AST (Phase 25 F-4)
        run: node scripts/verify-next-config-features.mjs

      # --- Phase 36 (P34-1): the dependency security floor ----------------
      #
      # Every gate above filters `pnpm audit` to critical and high before it
      # decides anything (`triage-vulnerabilities.mjs:748`). Phase 33 remediated
      # nine advisories across three packages by overriding `brace-expansion`
      # and `undici`, and chose 1.1.21 / 2.1.7 rather than the high-severity
      # floors 1.1.19 / 2.1.5 because a MODERATE advisory sets the real floor.
      #
      # The Phase 35 independent review then showed that choice was protected by
      # nothing: with the overrides lowered to 1.1.20 / 2.1.6 every gate here
      # exited 0 while advisories 1240100 and 1240101 were back in the graph.
      # This step reads the RESOLVED GRAPH in pnpm-lock.yaml — not the override
      # declaration — and fails if any instance sits below a recorded floor.
      #
      # It suppresses nothing: no audit ignore, no allow-list, no severity
      # change, no continue-on-error. It adds a check.
      - name: Supply chain — the dependency security floor is enforced (Phase 36 P34-1)
        run: node scripts/verify-dependency-security-floor.mjs

      # --- Phase 37 (R36-03): the floor policy is tamper-evident -----------
      #
      # The gate above reads its floors from
      # `security/dependency-security-floor.json`. Phase 37 moved them there
      # out of the gate's own source, because a control whose configuration
      # lives inside it cannot police that configuration: the Phase 36 review
      # demonstrated that editing one line of the gate lowered the floor while
      # every dependency gate stayed green and moderate advisories 1240100 /
      # 1240101 sat back in the resolved graph.
      #
      # This step is the independent contract that closes that gap. It asserts
      # each declared floor is at least the version that fixes every advisory
      # the floor claims to close, and that it agrees with the `pnpm-workspace.yaml`
      # override that actually enforces the remediation — a cross-artifact
      # check, not a file compared with itself. It needs no network and runs
      # before any install, so it cannot be skipped by an install failure.
      #
      # It suppresses nothing: no audit ignore, no allow-list, no severity
      # change, no continue-on-error. It adds a check.
      - name: Supply chain — the dependency floor policy cannot be weakened (Phase 37 R36-03)
        run: node scripts/verify-dependency-floor-policy.mjs

      # --- Phase 39 (F-39-01): advisories the pipeline does not currently see
      #
      # Found in the Phase 39 pre-flight, not by reading any report. The pipeline
      # filters to critical/high TWICE: `pnpm audit` is invoked with
      # `--audit-level=high`, so the JSON is already truncated before triage
      # reads it, and triage then filters to critical-or-high. Measured:
      #
      #     pnpm audit --json                       -> 92 advisories
      #     pnpm audit --audit-level=high --json    -> 48 advisories
      #     triage-vulnerabilities.mjs              -> 48 rows (critical/high)
      #
      # So 36 moderate and 8 low advisories reach NO gate. This is not
      # theoretical for this repository: the advisories Phase 33 remediated
      # (1240100, 1240101) are BOTH moderate, so the exact vulnerabilities the
      # security floor exists to exclude were invisible to the machinery meant
      # to notice their return. In the reproduced R36-03 graph those two
      # advisories appear in no gate output and all six dependency gates exit 0.
      #
      # This step reads the UNTRUNCATED advisory set and asserts one property: no
      # advisory may exist against a package the floor policy claims to
      # remediate, at ANY severity. It does not adjudicate the advisories outside
      # any floor — remediating those needs dependency upgrades (including next
      # 14.2.35 -> 15.5.x) that require a lockfile change and an authorization this
      # change does not carry. They are counted and reported instead, so the
      # remaining gap is on the record rather than out of sight.
      #
      # It suppresses nothing: no audit ignore, no allow-list, no severity
      # change, no continue-on-error. It adds a check.
      #
      # --- Phase 41 (F-40-01): "unfiltered" is now PROVEN, not asserted -------
      #
      # Phase 40's independent review found this step would PASS while claiming
      # otherwise. Non-emptiness is not completeness: a `--audit-level=moderate`
      # report still carries 84 of this repository's 92 advisories, so it is
      # comfortably non-empty and still not the full set. Reproduced before the
      # fix — the gate exited 0 on that report and printed "the full advisory set
      # was observed".
      #
      # The step now reconciles the advisory RECORDS against `metadata.vulnerabilities`,
      # the registry severity CENSUS that pnpm emits alongside them and that a
      # severity threshold does NOT touch. Measured on this repository:
      #
      #     pnpm audit --json                  -> 92 records; census 92   AGREE
      #     pnpm audit --audit-level=moderate  -> 84 records; census 92   DISAGREE -> rejected
      #     pnpm audit --audit-level=high      -> 48 records; census 92   DISAGREE -> rejected
      #
      # This is a structural property of the report, not a remembered count, so
      # the gate does not need editing when the registry publishes an advisory —
      # and there is therefore no number to loosen in order to make it pass.
      #
      # --- Phase 43 (P42-01): the census is not a census of the repository ---
      #
      # The Phase 42 independent review reproduced a silent pass that the
      # census cannot see. `pnpm audit --dev` and `--prod` do not filter by
      # severity; they reduce the set of PACKAGES submitted to the registry, so
      # the census shrinks in the same proportion and the report stays internally
      # consistent. With the prod-only `undici` floor package reverted to a
      # vulnerable version, `--dev` returned a report in which that package did
      # not appear at all, and this step passed while stating the set had been
      # proven unfiltered.
      #
      # The census therefore evidences the population pnpm was SUBMITTED, not
      # the population that exists. This step's command is deliberately unchanged
      # — the invariant is enforced inside the gate, which now
      #
      #   1. holds the audit invocation to an exact canonical form (an ALLOWLIST,
      #      not a denylist, so an unrecognised future flag fails closed), and
      #   2. compares `metadata.totalDependencies` against the number of packages
      #      pnpm-lock.yaml actually resolves, in every mode including --audit-file.
      #
      # Two independent witnesses, because the Phase 42 finding is precisely
      # that neither kind of check is sufficient alone.
      - name: Supply chain — advisories the pipeline filters out are observed, and proven unfiltered (Phase 39 F-39-01, Phase 41 F-40-01, Phase 43 P42-01)
        run: node scripts/verify-dependency-advisory-visibility.mjs

      - name: API unit tests
        run: pnpm --filter @ecc/api test

      - name: API integration tests (real PostgreSQL)
        run: pnpm --filter @ecc/api test:integration

      - name: API lint (advisory — 55 pre-existing errors carried from the
          Phase 16 checkpoint; see docs/PHASE_17_TESTING_CI_RELIABILITY.md)
        continue-on-error: true
        run: pnpm --filter @ecc/api lint

      # --- Phase 19: deployment readiness (validation only) --------------
      # These steps prove the production configuration contract and startup
      # path work, using only the ephemeral CI database and throwaway values
      # already present in this job. No cloud credentials, no production
      # secrets, and no deployment of any kind.

      - name: Deployment config — environment templates match code
        run: pnpm --filter @ecc/api exec node ../../scripts/verify-env-contract.mjs

      - name: Deployment config — production contract is enforced fail-closed
        env:
          STORAGE_DIR: ${{ runner.temp }}/ecc-ci-storage
        run: |
          cd apps/api
          # A valid production configuration must pass.
          NODE_ENV=production \
          DATABASE_URL="postgresql://ecc:ecc-ci-secret@localhost:5432/ecc_ci" \
          JWT_ACCESS_SECRET="ci-only-production-contract-value-32-chars-min" \
          STORAGE_DIR="$STORAGE_DIR" \
          node -e "require('./dist/config/runtime-config').assertRuntimeConfig(); console.log('valid production config accepted')"
          # An invalid one must abort startup rather than half-configure.
          #
          # Phase 24: `STORAGE_DIR=` is load-bearing. The step-level `env:`
          # sets STORAGE_DIR, so the second invocation INHERITED it, the API
          # started, and this step failed with "API started in production
          # without STORAGE_DIR (expected refusal)" — on the real runner, not
          # hypothetically. It never demonstrated the property it asserts,
          # because the only variable it was supposed to remove was the one
          # variable still set. Proved locally both ways: with STORAGE_DIR
          # inherited the process starts (exit 124 under `timeout`); with
          # `STORAGE_DIR=` it exits 1 naming the missing variable.
          if NODE_ENV=production \
             DATABASE_URL="postgresql://ecc:ecc-ci-secret@localhost:5432/ecc_ci" \
             JWT_ACCESS_SECRET="ci-only-production-contract-value-32-chars-min" \
             STORAGE_DIR= \
             node dist/main.js 2>/tmp/ecc-startup-err; then
            echo "::error::API started in production without STORAGE_DIR (expected refusal)"
            exit 1
          fi
          grep -q "STORAGE_DIR is required" /tmp/ecc-startup-err \
            || { echo "::error::startup failure did not name the missing variable"; exit 1; }

      - name: Deployment smoke — start API, probe health/readiness, stop cleanly
        env:
          STORAGE_DIR: ${{ runner.temp }}/ecc-ci-storage
        run: |
          cd apps/api
          mkdir -p "$STORAGE_DIR" && chmod 700 "$STORAGE_DIR"
          NODE_ENV=production \
          DATABASE_URL="postgresql://ecc:ecc-ci-secret@localhost:5432/ecc_ci?connection_limit=2" \
          JWT_ACCESS_SECRET="ci-only-production-contract-value-32-chars-min" \
          STORAGE_DIR="$STORAGE_DIR" \
          PORT=3123 node dist/main.js &
          API_PID=$!
          trap 'kill -TERM $API_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3123/api/v1/health/ready >/dev/null 2>&1; then break; fi
            sleep 1
          done
          # Liveness must not depend on the database.
          curl -fsS http://localhost:3123/api/v1/health | grep -q '"status":"ok"' \
            || { echo "::error::liveness probe failed"; exit 1; }
          # Readiness must succeed against the migrated CI database.
          curl -fsS http://localhost:3123/api/v1/health/ready | grep -q '"status":"ok"' \
            || { echo "::error::readiness probe failed"; exit 1; }
          # Graceful shutdown must terminate the process on SIGTERM.
          kill -TERM $API_PID
          for i in $(seq 1 20); do kill -0 $API_PID 2>/dev/null || break; sleep 0.5; done
          if kill -0 $API_PID 2>/dev/null; then
            echo "::error::API did not exit after SIGTERM"
            exit 1
          fi
          trap - EXIT

      # The full authentication surface, one production process per mode.
      # The rate limiter allows ten requests per IP per fifteen minutes, so
      # proving register, login, rotation, reuse detection, lockout, account
      # state and the token-defect matrix honestly takes more than ten. Rather
      # than disable the limiter — which would mean proving a weakened system      # — each mode runs against a freshly started server. No test-only code
      # path, flag or environment variable is introduced.
      - name: Compiled build — full authentication suite (Phase 23 W2)
        env:
          STORAGE_DIR: ${{ runner.temp }}/ecc-ci-auth-suite
          P23_AUTH_BASE_PORT: '13320'
        run: |
          mkdir -p "$STORAGE_DIR" && chmod 700 "$STORAGE_DIR"
          cd apps/api
          node scripts/verify-compiled-auth-suite.mjs

      - name: Artifact sanity — production image inputs are present
        run: |
          cd apps/api
          test -f dist/main.js || { echo "::error::dist/main.js missing"; exit 1; }
          test -f prisma/schema.prisma || { echo "::error::prisma schema missing"; exit 1; }
          test -d prisma/migrations || { echo "::error::prisma migrations missing"; exit 1; }
          if find dist -name '*.spec.js' -o -name '*.test.js' | grep -q .; then
            echo "::error::test files present in production dist"; exit 1
          fi
          if [ -d dist/testing ]; then
            echo "::error::test helpers present in production dist"; exit 1
          fi

      # --- Phase 22: the compiled-build authentication round-trip ----------
      # The suites above all run from TypeScript SOURCE via vitest/SWC. That
      # toolchain and `tsc` (which produces the shipped dist) disagree about
      # `design:paramtypes` when a DTO is imported with `import type`: SWC
      # degrades to `Object` and the ValidationPipe SKIPS validation, tsc emits
      # `Function` and the pipe RUNS it. So a build could be perfectly green
      # and still ship an image where every registration and login returned
      # 400. That is exactly what happened, undetected, until Phase 22 added a
      # real request against the built output.
      #
      # This step therefore drives the COMPILED dist through the real auth
      # flow, with no bypass of any kind. It runs here rather than only in the
      # `containers` job so the failure surfaces in about a minute instead of
      # after a full Docker build.
      - name: Compiled build — authenticated round-trip (Phase 22)
        env:
          STORAGE_DIR: ${{ runner.temp }}/ecc-ci-auth-storage
          # Phase 24. The secret must be in the STEP environment, not only on
          # the `node dist/main.js` line. A prefix assignment applies to that
          # one command, so the harness — a separate `node` invocation in the
          # same shell — did not see it, printed "skipping the
          # signature-based token assertions" and exited 0. The step was green
          # while asserting nothing about signature verification: the same
          # vacuous-green class Phase 23 found as P-1 and fixed in the suite
          # driver, still live in this step. Proved locally: without the export
          # the 13 token-defect cases and the token-lifetime assertions are
          # skipped; with it they all run and pass.
          JWT_ACCESS_SECRET: ci-only-production-contract-value-32-chars-min
        run: |
          cd apps/api
          mkdir -p "$STORAGE_DIR" && chmod 700 "$STORAGE_DIR"
          NODE_ENV=production \
          DATABASE_URL="postgresql://ecc:ecc-ci-secret@localhost:5432/ecc_ci?connection_limit=2" \
          JWT_ACCESS_SECRET="ci-only-production-contract-value-32-chars-min" \
          STORAGE_DIR="$STORAGE_DIR" \
          PORT=3124 node dist/main.js &
          API_PID=$!
          trap 'kill -TERM $API_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3124/api/v1/health/ready >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node scripts/verify-compiled-auth.mjs http://127.0.0.1:3124/api/v1
          kill -TERM $API_PID
          for i in $(seq 1 20); do kill -0 $API_PID 2>/dev/null || break; sleep 0.5; done
          if kill -0 $API_PID 2>/dev/null; then
            echo "::error::API did not exit after SIGTERM"
            exit 1
          fi
          trap - EXIT

  mobile:
    name: Mobile — typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 — see the api job for the full pnpm/engines analysis.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mobile typecheck
        run: pnpm --filter @ecc/mobile typecheck
      - name: Mobile tests
        run: pnpm --filter @ecc/mobile test
      - name: Mobile lint (advisory — pre-existing warnings block
          --max-warnings 0 at the checkpoint)
        continue-on-error: true
        run: pnpm --filter @ecc/mobile lint

  web:
    name: Web — typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 — see the api job for the full pnpm/engines analysis.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Web typecheck
        run: pnpm --filter @ecc/web typecheck
      - name: Web lint
        run: pnpm --filter @ecc/web lint
      - name: Web tests
        run: pnpm --filter @ecc/web test
      - name: Web build
        run: pnpm --filter @ecc/web build

      # --- Phase 36 (P35-1): the image-optimizer endpoint must be unreachable
      #
      # It must run HERE, after `Web build` and not before it: the gate reads the
      # BUILT `.next/images-manifest.json` and starts the standalone server from
      # the built tree, so with no web build it would fail for the wrong reason
      # — or, worse, be placed in the `api` job (which builds the API, not the
      # web) where it could never see the evidence it exists to check.
      #
      # Why it exists. Advisory 1193733 is a critical unauthenticated RCE in the
      # Next.js Image Optimization API when AVIF output is used. The triage rule
      # reported it NOT REACHABLE because the app renders no images — but Next
      # registers `/_next/image` regardless. The Phase 35 independent review
      # demonstrated it live in the production container: HTTP 200 with image
      # bytes, unauthenticated, in an app with no `<Image>` anywhere. The gate
      # now asserts the configuration, the built manifest and the RUNNING
      # server, and fails closed if any of the three cannot be read.
      - name: Web runtime — the Image Optimization endpoint is unreachable (Phase 36 P35-1)
        run: node scripts/verify-next-image-optimizer.mjs

  # --- Phase 23: release-assurance gates ---------------------------------
  #
  # These are the checks that need a real PostgreSQL or a long build, so they
  # are a separate job: a migration regression should not be masked by the
  # container job's 30-minute timeout, and neither should hide the other.

  release:
    name: Release — migrations, release artifacts, security regression sweeps
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecc
          POSTGRES_PASSWORD: ecc-ci-secret
          POSTGRES_DB: ecc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecc -d ecc_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ecc:ecc-ci-secret@localhost:5432/ecc_ci
      JWT_ACCESS_SECRET: ci-only-secret-value-min-32-chars-0000000000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 — see the api job for the pnpm/engines analysis.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # --- Phase 32: the CI contract is checked FIRST ------------------------
      #
      # Ordering, and it is the whole point of the change. This step used to sit
      # near the end of this job, AFTER the gates it validates. Hosted run
      # 36618193752 showed what that costs: the storage-backup step failed
      # first, so the job died on the symptom, the contract step was never
      # reached, and the run reported a bare
      # `ERR_PNPM_RECURSIVE_RUN_NO_SCRIPT` instead of the actual finding — that
      # the referenced script and file were not in the committed tree.
      #
      # The contract could already detect that. It simply never got to run. It
      # now runs immediately after the install, before anything it governs, so a
      # broken contract is reported as a broken contract. It must stay after
      # `pnpm install` because it parses the workflow and resolves package
      # scripts, and it tolerates the absence of `dist/` because the Phase 32
      # resolvability check recognises job-generated build output.
      #
      # It is executed, not merely listed, and it is not advisory.
      - name: CI contract — the workflow satisfies the parity contract (Phase 32 ordering)
        run: node scripts/verify-ci-parity.mjs --list

      - name: Generate Prisma client
        run: pnpm --filter @ecc/api exec prisma generate

      # The API build must precede the migration gate. `verify-db-migrations.sh`
      # ends by booting `node dist/main.js` and authenticating against it, so it
      # requires a built artifact to exist. On a clean CI checkout `dist/` is
      # absent, and running the gate before the build failed with
      # `Cannot find module .../apps/api/dist/main.js` (first real run,
      # 36557892479). This was invisible locally because the gate always ran
      # after some earlier build in the same working tree.
      #
      # Ordering is the whole fix; the gate is unchanged and still enforces
      # every check. `dist/` is intentionally not committed (.gitignore), so
      # the build cannot be skipped rather than reordered.
      - name: API build (for the migration and artifact checks)
        run: pnpm --filter @ecc/api build

      # W9. This script creates and destroys its OWN throwaway PostgreSQL
      # container, so it cannot touch this job's service database or a
      # developer's. It covers: schema validation, `migrate status` on an
      # empty database, `migrate deploy`, status after deploy, a repeated
      # deploy as a no-op, reproducibility onto a second empty database,
      # destructive-statement review, and the application booting and
      # authenticating against the freshly migrated schema.
      - name: Database — migration safety on throwaway databases (Phase 23 W9)
        run: bash scripts/verify-db-migrations.sh

      # W10. Proves the artifact contains what the source claims: a clean,
      # warm and stale-tsbuildinfo build each emit the entry point; dist is
      # 1:1 with source; no test, spec, fixture, raw TypeScript, credential
      # or unresolved require() is present; the artifact boots; two clean
      # builds are byte-identical; and the web build emits a standalone tree
      # with no baked secret and a runtime-read NEXT_PUBLIC_API_URL.
      - name: Release artifact — contents, hygiene, reproducibility (Phase 23 W10)
        run: node scripts/verify-release-artifact.mjs

      # --- Phase 29: Phase 28's storage-backup gate -------------------------
      #
      # The reviewer of Phase 28 recorded that this gate existed and ran only
      # on a laptop. A gate nobody runs is a convention, so it is wired in
      # here. It is deliberately placed IMMEDIATELY AFTER the release-artifact
      # check and BEFORE the mutation harnesses: it loads the REAL compiled
      # `StorageService` out of `dist/storage/storage.service.js`, so it must
      # read a dist that the artifact gate has just proved is clean, complete
      # and reproducible. Running it after a harness that rebuilds dist would
      # make its result depend on harness internals.
      #
      # Properties that made it cheap enough for CI: no database, no Docker, no
      # network, and no access to anything outside a `mkdtemp` tree it creates
      # and removes in a `finally`. Measured locally at 0.37s / 22 checks.
      - name: Storage backup — STORAGE_DIR archive, destroy, restore, re-verify (Phase 28 WS2)
        run: pnpm --filter @ecc/api verify:storage:backup

      # The mutation harnesses are not run in CI: each rebuilds the API image
      # with --no-cache, which is minutes of compute for a result that does
      # not change with a code edit. They are run deliberately and recorded in
      # the phase document. `pnpm --filter @ecc/api verify:metadata:mutate`
      # and `node scripts/mutate-config-contract.mjs` are cheap enough to run
      # here, so they are.
      - name: Mutation — the metadata gate detects the Phase 22 defect class (Phase 23 W1)
        run: pnpm --filter @ecc/api verify:metadata:mutate

      - name: Mutation — the authorization gate detects removed guards (Phase 23 W3)
        run: pnpm --filter @ecc/api verify:routes:mutate

      - name: Mutation — the access-token lifetime bound is load-bearing (Phase 24 D-2)
        run: pnpm --filter @ecc/api verify:lifetime:mutate

      # --- Phase 29: the Phase 28 N-12 regression guard ---------------------
      #
      # Phase 28 fixed N-12 (the rate limiter refused with 403, which clients
      # correctly treat as "your session is not authorised" and which the
      # mobile client acted on by deleting the session). The fix came with a
      # source-level regression suite AND this mutation harness that proves
      # the suite fails when the protection is removed.
      #
      # The container job also exercises the N-12 behaviour end to end, but
      # only inside `verify-docker-images.mjs`, minutes into a full image
      # build. This harness runs in about a minute with no Docker, so a
      # 429->403 revert surfaces here first. It is here at all because the
      # Phase 28 reviewer found it ran only when a human remembered.
      #
      # It MUTATES SOURCE in place and restores it, asserting byte-identity
      # itself; that is the same contract every other mutate-* harness in this
      # job already has. It is sequential with them for that reason.
      - name: Mutation — the N-12 429 contract is load-bearing (Phase 28)
        run: pnpm --filter @ecc/api verify:ratelimit:n12:mutate

      - name: Mutation — the configuration audit detects drift (Phase 23 W5)
        run: node scripts/mutate-config-contract.mjs

      # Each of these re-runs `pnpm audit` once per mutant, so it costs
      # minutes; the same trade-off as the harnesses above, and for the same
      # reason. The F-4 one is here because the rule it proves is a security
      # claim — "no request is re-dispatched to a configured destination" —
      # and a claim of that kind is worth the compute once per release.
      - name: Mutation — the rewrites triage rule sees the form Next.js supports (Phase 25 F-4)
        run: node scripts/mutate-next-config-rewrites.mjs

      # --- Phase 36: the two new controls are themselves mutation-tested -----
      #
      # A gate that has never been shown to fail might not fail, and the Phase 35
      # review found exactly that in `verify-ci-parity.mjs`: the untracked-artifact
      # assertion was implemented, read, and exercised by nothing that could.
      #
      # Both harnesses mutate throwaway MIRRORS and assert the real files are
      # byte-identical afterwards. The image-optimizer harness needs the built web
      # tree and reports SKIPPED (exit 2) without it, which fails this job rather
      # than being recorded as a pass.
      #
      # The build is its OWN step, not a line above the harness in one `run:`
      # block. The CI contract matches a required gate on its whole normalised
      # command, so a two-line block collapses to `pnpm … build node …` and the
      # harness no longer matches its declared `exactCommand` — the contract
      # caught exactly this when it was written that way the first time.
      - name: Web build (for the image-optimizer mutation harness)
        run: pnpm --filter @ecc/web build

      - name: Mutation — the image-optimizer gate detects the P35-1 state (Phase 36)
        run: node scripts/mutate-next-image-optimizer.mjs

      - name: Mutation — the dependency floor detects a lowered remediation (Phase 36)
        run: node scripts/mutate-dependency-security-floor.mjs

      # --- Phase 37 (R36-03): the floor-policy protection -------------------
      #
      # Mutation-testing the protection is what makes it load-bearing rather
      # than intended. It covers the lowering of each floor, a deleted floor, a
      # malformed and a computed minimum, a deleted advisory record, the removal
      # of the CI registration above, and the coordinated edit that lowers the
      # floor and its evidence together — with positive controls proving that a
      # legitimate remediation (raising a floor) and a pure reformat are not
      # punished.
      - name: Mutation — the floor policy cannot be weakened (Phase 37 R36-03)
        run: node scripts/mutate-dependency-floor-policy.mjs

      # --- Phase 39 (F-39-01) + Phase 41 (F-40-02): the visibility control --
      #
      # Mutation-testing the visibility control proves the floor is enforced
      # against the FULL advisory set, not only the part triage happens to see:
      # a moderate, a low and a critical advisory against either floored
      # package, an empty or malformed report, an emptied floor policy, and the
      # removal of the CI step above — with a positive control proving that a
      # moderate advisory against a package carrying NO floor is reported rather
      # than treated as a floor failure.
      #
      # Phase 41 adds what Phase 40 found missing. Phase 39's mutants varied the
      # advisory FIXTURE, the policy and the workflow; none wrote the gate's own
      # source, so every line that decides the property under test was untested.
      # The M41-SRC-* mutants now rewrite the control itself and prove each of
      # those lines load-bearing, and the M41-FILTER-* mutants feed GENUINE
      # `pnpm audit --audit-level=...` reports captured from the real package
      # manager rather than hand-written stand-ins.
      #
      # Note the two polarities, which are deliberately opposite and are reported
      # separately: a source mutant that WEAKENS the control must exit 0 (that is
      # the proof the line matters), while an adversarial-state mutant must be
      # rejected (exit 1). A harness that scored both the same way would report a
      # working control as unproven.
      - name: Mutation — advisories outside the triage threshold still fail a broken floor (Phase 39 F-39-01, Phase 41 F-40-02)
        run: node scripts/mutate-dependency-advisory-visibility.mjs

      # --- Phase 29: the Phase 28 DB-suite driver ---------------------------
      #
      # `run-db-suites.mjs` provisions its OWN throwaway PostgreSQL, migrates
      # it, and runs the database-backed suites against it. The `api` job also
      # runs those suites, but against a long-lived service database that other
      # steps in that job have already written to (the startup smoke test
      # registers and authenticates a real user), and it never runs
      # `test:all`, which is the only configuration in which the unit and
      # integration suites are executed in the SAME process against the SAME
      # database — the configuration in which cross-suite state leaks would
      # show up. That is what this step adds; it is not a duplicate of the
      # `api` job.
      #
      # It needs Docker, which ubuntu-latest provides, and it needs no
      # credentials: the database name is generated per run and prefixed, so
      # the developer `ecc` database is not reachable even by a bug.
      - name: Database-backed suites — e2e and unit+integration on a fresh throwaway PostgreSQL (Phase 28)
        run: node scripts/run-db-suites.mjs

      # --- Phase 29: the CI integration is itself mutation-tested ----------
      #
      # The wiring above is only worth something if removing it is detectable.
      # This harness mutates a THROWAWAY COPY of `.github/workflows/ci.yml`
      # and `scripts/verify-ci-parity.mjs` — never the checked-out files — so
      # a defect in the harness cannot leave a mutated workflow behind for the
      # remaining steps, which is the failure mode (N-10) that bit this
      # project before. It asserts the real files are byte-identical when it
      # finishes regardless of outcome.
      - name: Mutation — removing a required Phase 28 gate from CI is detected (Phase 29)
        run: node scripts/mutate-ci-integration.mjs

      - name: Dependency audit has not been weakened
        run: git diff --exit-code -- pnpm-lock.yaml

  # --- Phase 20/22: container build and runtime verification ---------------
  # P19-01: both Dockerfiles were pre-existing from Phase 1 and had never
  # been built — their runtime stages copied apps/<app>/node_modules, whose
  # entries are symlinks into the workspace root's node_modules/.pnpm store
  # that was never copied, so neither image could start. This job builds
  # both images for real and runs them. The script creates and destroys its
  # own throwaway PostgreSQL container, so it needs no service and never
  # touches a developer or CI database.
  #
  # Phase 22 added the authenticated register/login/protected-request
  # round-trip and the escaping-symlink check. Those exist because a
  # production image once shipped in which `POST /auth/register` and
  # `POST /auth/login` returned 400 for every request — the image booted and
  # served health checks perfectly while authentication was completely
  # broken. Nothing short of a real request would have caught it.
  #
  # Scope is image correctness only: no registry push, no cloud, no
  # orchestration, no compose deployment, no secrets.

  containers:
    name: Containers — build API and Web images, verify they run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm@11.25.0 (packageManager) requires Node >= 22.13; the
          # Dockerfiles use node:24-alpine for the same reason.
          node-version: 24

      # Fail fast and loudly if the image build cannot pull its base images or
      # reach a registry, rather than surfacing as an opaque mid-build failure.
      - name: Docker is available and responding
        run: docker version && docker info >/dev/null

      - name: Build images and verify container runtime behaviour
        run: node scripts/verify-docker-images.mjs
